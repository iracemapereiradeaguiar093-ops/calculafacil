<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalculaFácil - Calculadoras Online Gratuitas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: #2864e8;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 46px;
        }

        header p {
            font-size: 22px;
            margin: 25px 0 0;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            margin-bottom: 30px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h2 {
            color: #2864e8;
            font-size: 32px;
            margin-top: 0;
        }

        label {
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0 8px;
        }

        input {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            border: 2px solid #d5dbe5;
            border-radius: 18px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: #2864e8;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        .resultado {
            margin-top: 25px;
            padding: 20px;
            background: #edf4ff;
            border-radius: 18px;
            color: #2864e8;
            font-size: 22px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>CalculaFácil</h1>
    <p>Ferramentas gratuitas para facilitar o teu dia.</p>
</header>

<main>

    <!-- CALCULADORA DE PERCENTAGEM -->

    <div class="card">

        <h2>Calculadora de Percentagem</h2>

        <label for="percentagem">Percentagem</label>
        <input type="number" id="percentagem" placeholder="Ex: 20">

        <label for="numero">Número</label>
        <input type="number" id="numero" placeholder="Ex: 150">

        <button onclick="calcularPercentagem()">
            Calcular
        </button>

        <div class="resultado" id="resultadoPercentagem">
            Resultado: —
        </div>

    </div>


    <!-- CALCULADORA DE DESCONTO -->

    <div class="card">

        <h2>Calculadora de Desconto</h2>

        <label for="preco">Preço (€)</label>
        <input type="number" id="preco" placeholder="Ex: 100">

        <label for="desconto">Desconto (%)</label>
        <input type="number" id="desconto" placeholder="Ex: 20">

        <button onclick="calcularDesconto()">
            Calcular desconto
        </button>

        <div class="resultado" id="resultadoDesconto">
            Resultado: —
        </div>

    </div>


    <!-- CALCULADORA DE MÉDIA -->

    <div class="card">

        <h2>Calculadora de Média</h2>

        <p>
            Introduz as notas que quiseres. Os campos que ficarem vazios serão ignorados.
        </p>

        <label for="nota1">Nota 1</label>
        <input type="number" id="nota1" placeholder="Ex: 15">

        <label for="nota2">Nota 2</label>
        <input type="number" id="nota2" placeholder="Ex: 17">

        <label for="nota3">Nota 3</label>
        <input type="number" id="nota3" placeholder="Ex: 13">

        <label for="nota4">Nota 4</label>
        <input type="number" id="nota4" placeholder="Ex: 16">

        <label for="nota5">Nota 5</label>
        <input type="number" id="nota5" placeholder="Ex: 14">

        <button onclick="calcularMedia()">
            Calcular média
        </button>

        <div class="resultado" id="resultadoMedia">
            Média: —
        </div>

    </div>

</main>

<footer>
    CalculaFácil — Ferramentas online gratuitas
</footer>


<script>

    function calcularPercentagem() {

        let percentagem = Number(
            document.getElementById("percentagem").value
        );

        let numero = Number(
            document.getElementById("numero").value
        );

        if (!percentagem || !numero) {
            document.getElementById("resultadoPercentagem").innerText =
                "Preenche os dois campos.";
            return;
        }

        let resultado = (percentagem / 100) * numero;

        document.getElementById("resultadoPercentagem").innerText =
            "Resultado: " + resultado;
    }


    function calcularDesconto() {

        let preco = Number(
            document.getElementById("preco").value
        );

        let desconto = Number(
            document.getElementById("desconto").value
        );

        if (!preco || !desconto) {
            document.getElementById("resultadoDesconto").innerText =
                "Preenche os dois campos.";
            return;
        }

        let valorDesconto = (preco * desconto) / 100;

        let precoFinal = preco - valorDesconto;

        document.getElementById("resultadoDesconto").innerText =
            "Desconto: " + valorDesconto.toFixed(2) +
            " € | Preço final: " + precoFinal.toFixed(2) + " €";
    }


    function calcularMedia() {

        let notas = [];

        for (let i = 1; i <= 5; i++) {

            let valor = document.getElementById("nota" + i).value;

            if (valor !== "") {
                notas.push(Number(valor));
            }
        }

        if (notas.length === 0) {

            document.getElementById("resultadoMedia").innerText =
                "Introduz pelo menos uma nota.";

            return;
        }

        let soma = 0;

        for (let nota of notas) {
            soma += nota;
        }

        let media = soma / notas.length;

        document.getElementById("resultadoMedia").innerText =
            "Média: " + media.toFixed(2);
    }

</script>

</body>
</html>
